<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いっぷ句</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17303F; --ink2:#24485C; --mist:#EDF1F3; --mist2:#DCE4E8;
  --shu:#C0503C; --moss:#2F6E5E; --muted:#5A6B76; --line:#C9D4DA;
  --bg:#E4EAED; --surface:#FFFFFF; --text:#17303F; --sub:#5A6B76;
  --chip:#EDF1F3; --chipOn:#17303F; --chipOnText:#FFFFFF;
  --green:#3E8E5E; --yellow:#D9A400; --red:#C0503C;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E27; --surface:#17303F; --text:#EDF1F3; --sub:#A9BAC4;
    --mist:#1F3D4F; --mist2:#24485C; --line:#2F5568; --chip:#1F3D4F;
    --chipOn:#EDF1F3; --chipOnText:#17303F; --ink:#EDF1F3; --ink2:#C9D4DA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E27; --surface:#17303F; --text:#EDF1F3; --sub:#A9BAC4;
  --mist:#1F3D4F; --mist2:#24485C; --line:#2F5568; --chip:#1F3D4F;
  --chipOn:#EDF1F3; --chipOnText:#17303F; --ink:#EDF1F3; --ink2:#C9D4DA;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--surface);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.phone{margin:24px auto;min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 0 0 1px var(--line);overflow:hidden}}
.mockbar{font-size:11px;color:var(--sub);background:var(--mist);text-align:center;padding:4px 8px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--sub);font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer;min-width:28px}
.back:disabled{visibility:hidden}
.steptitle{font-weight:700;font-size:15px}
.stepcount{margin-left:auto;font-size:12px;color:var(--sub)}
.progress{display:flex;gap:4px;margin-top:8px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--mist2)}
.progress span.on{background:var(--ink2)}
main{flex:1;padding:18px 18px 110px;overflow-x:hidden}
h1{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.45;margin:6px 0 10px}
h2{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.5;margin:0 0 6px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.card{background:var(--mist);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card.line{background:none;border:1px solid var(--line)}
.patient{display:flex;gap:12px;align-items:flex-start}
.patient .name{font-weight:700;font-size:16px}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
.vital{background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;border:1.5px solid transparent;text-align:left;color:var(--text);font:inherit;font-size:13px}
.vital b{display:block;font-size:16px}
.vital.on{border-color:var(--shu)}
.vital small{color:var(--sub)}
.q{font-weight:700;margin:18px 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
.note{font-size:12px;color:var(--sub)}
.foot{position:sticky;bottom:0;margin-top:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px 12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--ink2);color:#fff}
:root[data-theme="dark"] .btn{background:#C9D4DA;color:#17303F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:#C9D4DA;color:#17303F}}
.btn.sub{background:var(--mist);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
/* 病室の絵 */
.scene{border-radius:14px;overflow:hidden;background:#F3F0E8;margin:0 0 6px}
.scene svg{display:block;width:100%;height:auto}
.scene-cap{font-size:12px;color:var(--sub);margin:0 0 14px}
/* 句の入力 */
.kuform{display:grid;gap:8px;margin:6px 0 4px}
.kurow{display:flex;align-items:center;gap:8px}
.kurow input{font-family:var(--serif);font-size:17px}
.mora{font-size:12px;color:var(--sub);min-width:56px;text-align:right}
.mora.ok{color:var(--moss);font-weight:700}
/* 短冊：このモックで唯一の見せ場 */
.tanzaku-row{display:flex;flex-direction:row-reverse;gap:10px;overflow-x:auto;padding:4px 2px 10px;justify-content:flex-start}
.tanzaku{writing-mode:vertical-rl;font-family:var(--serif);font-size:17px;line-height:1.9;letter-spacing:.08em;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 8px;min-height:210px;flex:0 0 auto;position:relative}
.tanzaku.mine{border-color:var(--ink2);box-shadow:inset 0 0 0 1px var(--ink2)}
.tanzaku.expert{border-color:var(--moss);box-shadow:inset 0 0 0 1px var(--moss)}
.tanzaku .who{font-family:var(--sans);font-size:10px;color:var(--sub);letter-spacing:0;margin-top:10px}
.tanzaku .lock{font-family:var(--sans);font-size:10px;color:var(--sub);letter-spacing:0}
.peer{display:flex;flex-direction:column;align-items:center;gap:6px}
.react{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.react.on{background:var(--shu);border-color:var(--shu);color:#fff}
.counter{display:flex;gap:6px;align-items:center;margin:4px 0 12px}
.counter i{width:22px;height:6px;border-radius:3px;background:var(--mist2)}
.counter i.on{background:var(--shu)}
.counter span{font-size:12px;color:var(--sub);margin-left:4px}
/* 信号 */
.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sig{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:12px 6px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.sig i{width:26px;height:26px;border-radius:50%}
.sig.on{border-width:3px}
.sig[data-v="緑"] i{background:var(--green)} .sig[data-v="緑"].on{border-color:var(--green)}
.sig[data-v="黄"] i{background:var(--yellow)} .sig[data-v="黄"].on{border-color:var(--yellow)}
.sig[data-v="赤"] i{background:var(--red)} .sig[data-v="赤"].on{border-color:var(--red)}
.sbar{display:grid;gap:8px}
.sbar label{display:flex;gap:10px;align-items:flex-start}
.sbar label b{font-family:var(--serif);width:18px;padding-top:10px;text-align:center}
/* レポート */
.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.dot.me{background:var(--ink2);border-color:var(--ink2)}
.dot.ex{background:var(--moss);border-color:var(--moss)}
.gap td:first-child{color:var(--shu);font-weight:700}
.insight{border-left:3px solid var(--shu);padding:2px 0 2px 12px;margin:0 0 14px}
.insight.good{border-color:var(--moss)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp > div{background:var(--surface);border-radius:10px;padding:10px}
.cmp small{color:var(--sub);display:block}
.done{text-align:center;padding-top:30px}
.done .big{font-family:var(--serif);font-size:44px;color:var(--shu)}
.src{font-size:11px;color:var(--sub);margin-top:20px;line-height:1.6}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.day{border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;background:var(--surface);position:relative;min-height:112px;display:flex;flex-direction:column;align-items:center;gap:4px}
.day .dn{font-size:11px;color:var(--sub);letter-spacing:.06em}
.day .sn{font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.4}
.day.now{border:2px solid var(--shu)}
.day.lock{opacity:.45}
.seal{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--shu);color:var(--shu);font-family:var(--serif);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);margin-top:2px}
.seal.empty{border-style:dashed;border-color:var(--line);color:var(--line)}
.streak{display:flex;align-items:baseline;gap:6px;margin:4px 0 2px}
.streak b{font-family:var(--serif);font-size:34px;color:var(--shu);line-height:1}
.scene-q{background:var(--ink2);color:#fff;border-radius:12px;padding:12px 14px;margin:0 0 12px}
:root[data-theme="dark"] .scene-q{background:#C9D4DA;color:#17303F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene-q{background:#C9D4DA;color:#17303F}}
.scene-q small{display:block;opacity:.8;font-size:12px}
.scene-q b{font-family:var(--serif);font-size:17px}
.situ{font-size:14px;margin:0 0 12px}
.bigseal{width:110px;height:110px;font-size:46px;border-width:4px;margin:10px auto}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}@keyframes stamp{from{transform:scale(1.8) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}}
.tanzaku.sm{min-height:130px;font-size:14px;padding:10px 6px}
.tomorrow{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
/* LINEトーク（イメージ） */
.talk{flex:1;display:flex;flex-direction:column;background:#C9D6E3;min-height:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .talk{background:#1B2B36}}
:root[data-theme="dark"] .talk{background:#1B2B36}
.talkhead{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.oa{width:34px;height:34px;border-radius:50%;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:0 0 auto}
.talkbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:8px;align-items:flex-start}
.bubble{background:var(--surface);border-radius:4px 16px 16px 16px;padding:10px 14px;max-width:78%;font-size:14px;line-height:1.6}
.bubble .cardbtn{display:block;margin-top:10px;border:0;border-radius:10px;background:var(--ink2);color:#fff;font:inherit;font-weight:700;padding:10px;width:100%;cursor:pointer}
.time{font-size:10px;color:var(--sub);align-self:flex-end}
.richmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.richmenu button{border:0;background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:700;padding:10px 6px;cursor:pointer}
.richmenu button small{display:block;font-weight:400;color:var(--sub);font-size:11px}
/* LIFFのヘッダー（イメージ） */
.liffbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.liffbar .x{border:0;background:none;font-size:20px;color:var(--text);cursor:pointer;width:32px}
.liffbar .t{flex:1;text-align:center;line-height:1.3}
.liffbar .t b{display:block;font-size:14px}
.liffbar .t small{font-size:10.5px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink2);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:20;max-width:90%;text-align:center}
.single{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 4px}
.single .lab{font-size:13px;font-weight:700;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;margin-top:2px}
.scenetag{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-bottom:6px}
/* 画面切り替え */
.switcher{position:sticky;top:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.switcher button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.switcher button.on{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.packtag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--mist);color:var(--sub);margin-right:4px}
.packcard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);color:var(--text);font:inherit;margin:0 0 10px;cursor:pointer}
.packcard.on{border-color:var(--shu);box-shadow:inset 0 0 0 1px var(--shu)}
.packcard:disabled{opacity:.45;cursor:not-allowed}
.packcard b{font-size:16px}
.modecard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);color:var(--text);font:inherit;margin:0 0 10px;cursor:pointer}
.stepgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stepgrid .day{min-height:96px}
.art{border-radius:12px;overflow:hidden;margin:0 0 6px;background:#eee}
.art img{display:block;width:100%;height:auto}
.count{font-size:12px;color:var(--sub)}
.bar{height:8px;border-radius:4px;background:var(--mist2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--moss)}
/* 管理画面 */
.admin{max-width:1040px;margin:0 auto;padding:16px;min-height:100vh}
.admin h1{font-size:22px;margin:4px 0 2px}
.atabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 16px}
.atabs button{border:0;background:none;color:var(--sub);font:inherit;font-weight:700;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent}
.atabs button.on{color:var(--text);border-bottom-color:var(--shu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--sub);display:block;font-size:12px}
.kpi b{font-family:var(--serif);font-size:26px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--sub);font-weight:700;background:var(--mist)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--mist)}
.pchk{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:13px}
.notice{border-left:3px solid var(--shu);background:var(--surface);padding:10px 12px;border-radius:0 10px 10px 0;margin:0 0 12px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard h2{margin:0 0 4px}
.status{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
.status.live{background:var(--moss);color:#fff}
.status.prep{background:var(--mist2);color:var(--sub)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre;overflow-x:auto;background:var(--mist);border-radius:10px;padding:10px;margin:0 0 12px}
.select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--text)}

.phone{min-height:auto}
/* ===== やさしさ（学習者の画面だけに適用） ===== */
.phone{--bg:#F4EEE3;--surface:#FFFDF8;--mist:#F5EEE2;--mist2:#E9DFCD;--line:#E4D8C4;--text:#3F3A34;--sub:#8A7E70;--ink:#3F3A34;--ink2:#5E8A73;--shu:#D9785D;--moss:#5E8A73;--chip:#FBF6EE;--chipOn:#5E8A73;--chipOnText:#FFFFFF;--green:#6FA37F;--yellow:#E3B54A;--red:#D9785D;
  font-family:"Zen Maru Gothic",var(--sans);background:var(--surface);color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .phone{--bg:#1E1B18;--surface:#26221E;--mist:#302B26;--mist2:#3B342D;--line:#4A4239;--text:#F1EAE0;--sub:#BFB3A4;--ink:#F1EAE0;--ink2:#8DB79E;--shu:#E7987F;--moss:#8DB79E;--chip:#302B26;--chipOn:#8DB79E;--chipOnText:#1E1B18}}
:root[data-theme="dark"] .phone{--bg:#1E1B18;--surface:#26221E;--mist:#302B26;--mist2:#3B342D;--line:#4A4239;--text:#F1EAE0;--sub:#BFB3A4;--ink:#F1EAE0;--ink2:#8DB79E;--shu:#E7987F;--moss:#8DB79E;--chip:#302B26;--chipOn:#8DB79E;--chipOnText:#1E1B18}
.phone h1,.phone h2{font-family:"Zen Maru Gothic",var(--sans);font-weight:700;letter-spacing:.02em}
.phone .btn{border-radius:999px;background:var(--ink2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s ease}
.phone .btn:active{transform:translateY(2px);box-shadow:none}
.phone .btn.sub{background:var(--mist);color:var(--text);box-shadow:none}
.phone .card{border-radius:20px}
.phone .chip{border-radius:999px;background:var(--chip);transition:transform .12s ease,background .2s}
.phone .chip:active{transform:scale(.96)}
.phone .chip.on{background:var(--chipOn);color:var(--chipOnText);border-color:var(--chipOn)}
.phone .vital{border-radius:14px}
.phone .packcard,.phone .modecard{border-radius:20px}
.phone .progress span{height:6px;border-radius:3px}
.phone .progress span.on{background:var(--ink2)}
.phone .liffbar,.phone header.top,.phone .foot{background:var(--surface)}
.phone .talk{background:#E8EFE6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .phone .talk{background:#20261F}}
:root[data-theme="dark"] .phone .talk{background:#20261F}
.phone .bubble{border-radius:6px 20px 20px 20px}
.phone .oa{background:var(--ink2)}
.phone textarea,.phone .kurow input{border-radius:14px!important}

details.more{margin:6px 0 12px;border-radius:14px;background:var(--mist);padding:2px 12px}
details.more summary{cursor:pointer;font-size:13px;color:var(--sub);padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}

function genSample(k,n){ const p=P(),it=p.intake,ex=EXP[S.pack]||{acts:[]},f=[...S.first],c=[...S.causes],acts=[...S.acts],tell=[...S.tell],tool=[...S.tools][0];
  const f0=f[0]||"全体の様子", f1=f[1], lv=S.level?`「${S.level}」`:"進め方", d=p.s3?p.s3.detail:[["様子",""],["状況",""]];

  document.querySelectorAll("button.stt").forEach(b=>b.onclick=()=>{ const o=ORGS[+b.dataset.st]; o.active=o.active===false; S.audit.push({t:now(),who:"運営",what:`${o.name} を${o.active?"アクティブ":"非アクティブ"}に変更`}); render(); });
  document.querySelectorAll("button.del").forEach(b=>b.onclick=()=>{ const i=+b.dataset.del,o=ORGS[i]; if(S.delAsk!==o.code){ S.delAsk=o.code; render(); return; } S.delAsk=null; const keep=ORGS[S.aorg]; ORGS.splice(i,1); S.aorg=Math.max(0,ORGS.indexOf(keep)); if(S.org===o){ S.org=null; S.pack=null; S.ph="talk"; S.msgs.push({t:"08:30",html:"所属していた組織が削除されました。組織コードを入れ直してください。",btn:"組織コードを入れる"}); } S.audit.push({t:now(),who:"運営",what:`組織を削除（${o.name}・${o.code}）`}); render(); });
  document.querySelectorAll('input[data-o]').forEach(c=>c.onchange=()=>{ const o=ORGS[+c.dataset.o],k=c.dataset.p; if(c.checked){ if(!o.packs.includes(k)) o.packs.push(k);} else { if(o.packs.length===1){ c.checked=true; return;} o.packs=o.packs.filter(x=>x!==k);} S.audit.push({t:now(),who:"運営",what:`${o.name} の業界パックを変更（${o.packs.map(x=>PACKS[x].name).join("・")}）`}); render(); });
  document.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>{ const o=ORGS[S.aorg],r=learnerRows(o)[+tr.dataset.i]; S.detail={i:+tr.dataset.i}; S.audit.push({t:now(),who:"教員（デモ）",what:`${o.name}：${r.name} の記録を閲覧`}); render(); });
  const csv=$("csv"); if(csv) csv.onclick=()=>{ S.audit.push({t:now(),who:"研究者（デモ）",what:"研究用CSVを出力（同意者のみ・仮名ID）"}); render(); };
}
// ===== 検証版：保存とURL（#history・#posts・#join） =====
const KEY="ippuku-line-test-v2";
const LIFF_ID="2012192016-D0MCxjX9";
let LIFF_OK=false;
async function initLiff(){ try{ if(!window.liff) return; await liff.init({liffId:LIFF_ID}); LIFF_OK=true;
  if(liff.isLoggedIn()){ try{ const pr=await liff.getProfile(); S.lineName=pr.displayName; window.__lineName=pr.displayName; render(); }catch(e){} } }catch(e){ console.warn("LIFF init failed",e); } }
async function closeLine(finished){ persist();
  if(LIFF_OK&&liff.isInClient()){
    if(finished){ try{ await liff.sendMessages([{type:"text",text:"終わりました"}]); }catch(e){ console.warn(e); } }
    try{ liff.closeWindow(); return; }catch(e){}
  }
  S.toast="画面上部の✕で閉じてLINEに戻り、「終わりました」を押してください"; render(); }
const ADD_FRIEND="https://line.me/R/ti/p/@777vdkoq";
async function shareKu(){
  const ku=S.art[S.art.length-1]; if(!ku){ S.toast="先に句を詠んでください"; render(); return; }
  if(!(LIFF_OK&&liff.isApiAvailable&&liff.isApiAvailable("shareTargetPicker"))){ S.toast="LINEの中で開いたときに使えます"; render(); return; }
  const name=S.lineName||"いっぷ句の仲間";
  const line=t=>({type:"text",text:t,size:"xl",weight:"bold",color:"#2B3A42",align:"center",wrap:true});
  const msg={type:"flex",altText:"いっぷ句："+ku.join(" "),contents:{type:"bubble",
    header:{type:"box",layout:"vertical",backgroundColor:"#F4EFE6",paddingAll:"14px",contents:[{type:"text",text:"いっぷ句",size:"sm",color:"#7A6A55",weight:"bold"},{type:"text",text:"一枚の絵を観て、五七五で詠みました",size:"xs",color:"#7A6A55",margin:"4px",wrap:true}]},
    body:{type:"box",layout:"vertical",spacing:"md",paddingAll:"22px",contents:[line(ku[0]),line(ku[1]),line(ku[2]),{type:"text",text:"― "+name,size:"sm",color:"#7A6A55",align:"end",margin:"lg"}]},
    footer:{type:"box",layout:"vertical",contents:[{type:"button",style:"primary",color:"#2F5D50",action:{type:"uri",label:"いっぷ句をのぞいてみる",uri:ADD_FRIEND}}]}}};
  try{ const r=await liff.shareTargetPicker([msg]); S.toast=r?"送りました":"送るのをやめました"; }catch(e){ S.toast="送れませんでした（"+(e&&(e.code||e.message)||e)+"）"; }
  render(); }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({code:S.org&&S.org.code,pack:S.pack,consent:S.consent,mode:S.mode,split:S.split,art:S.art,ward:S.ward,single:S.single,text:S.text,history:S.history,done:S.done})); }catch(e){} }
function restore(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||"null"); if(!d||!d.code) return false; const o=ORGS.find(x=>x.code===d.code); if(!o) return false;
  Object.assign(S,{org:o,pack:d.pack,consent:d.consent,mode:d.mode,split:d.split||{cur:0,done:[]},art:d.art||[],ward:d.ward||[],single:d.single||{},text:d.text||{},history:d.history||[],done:!!d.done}); return true; }catch(e){ return false; } }
function route(){ const h=(location.hash||"").replace("#","");
  if(h==="join"){ try{localStorage.removeItem(KEY);}catch(e){} reset(); S.ph="join"; render(); scrollTo(0,0); return; }
  const ok=restore();
  if((h==="history"||h==="posts")&&ok&&S.pack) S.ph="history";
  else if(ok&&S.pack&&S.consent&&S.mode) S.ph=S.done?"done":(S.mode==="split"?"splithome":"step");
  else if(ok&&S.pack) S.ph="consent";
  else S.ph="join";
  render(); scrollTo(0,0); }
window.addEventListener("hashchange",()=>{ reset(); S.lineName=window.__lineName; route(); });
route();
initLiff();


</script>
