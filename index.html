<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いっぷ句</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#EDE6DA;--surface:#FFFDF8;--mist:#F5EEE2;--mist2:#E9DFCD;--line:#E4D8C4;--text:#3F3A34;--sub:#857A6C;--ink:#5E8A73;--ink-d:#4B7360;--shu:#D9785D;--talk:#E8EFE6;--cov:#CDBFA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16130F;--surface:#26221E;--mist:#302B26;--mist2:#3B342D;--line:#4A4239;--text:#F1EAE0;--sub:#BFB3A4;--ink:#8DB79E;--ink-d:#9CC4AC;--shu:#E7987F;--talk:#20261F;--cov:#4A4239}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16130F;--surface:#26221E;--mist:#302B26;--mist2:#3B342D;--line:#4A4239;--text:#F1EAE0;--sub:#BFB3A4;--ink:#8DB79E;--ink-d:#9CC4AC;--shu:#E7987F;--talk:#20261F;--cov:#4A4239}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.phone{max-width:430px;margin:0 auto;height:100%;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){body{padding:12px 0}.phone{border-radius:28px;box-shadow:0 0 0 1px var(--line)}}
.mockbar{font-size:11px;color:var(--sub);background:var(--mist);text-align:center;padding:4px 8px}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar .x{border:0;background:none;font-size:20px;color:var(--text);width:32px;cursor:pointer}
.bar .t{flex:1;text-align:center;line-height:1.3}.bar .t b{display:block;font-size:14px}.bar .t small{font-size:11px;color:var(--sub)}
.steps{display:flex;gap:4px;padding:8px 14px 0}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--mist2)}.steps span.on{background:var(--ink)}
.steplabel{font-size:12px;color:var(--sub);padding:6px 16px 8px;border-bottom:1px solid var(--line)}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px}
.foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.btn{flex:1;border:0;border-radius:999px;padding:14px 10px;font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sub{background:var(--mist);color:var(--text);box-shadow:none}
h2{font-size:19px;margin:6px 0 8px;line-height:1.45}
.lead{font-size:14px;color:var(--sub);margin:0 0 10px;line-height:1.6}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.card{background:var(--mist);border-radius:18px;padding:12px 14px;margin:0 0 12px}
.q{font-size:14px;font-weight:700;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.photo{border-radius:16px;overflow:hidden;position:relative}
.photo svg,.photo img{display:block;width:100%;height:auto}
.ku{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--text)}
.kurow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:6px 0}
.mora{font-size:12px;color:var(--sub);min-width:52px;text-align:right}.mora.ok{color:var(--ink-d);font-weight:700}
.addrow{display:flex;gap:8px;margin:6px 0}.addrow input{flex:1}
.addrow button{border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.addrow button:disabled{opacity:.45}
.ob{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}
.ob.new{border-color:var(--ink)}
.sample{border:0;background:none;color:var(--ink-d);font:inherit;font-size:12.5px;padding:4px 0;cursor:pointer;text-decoration:underline}
.cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.cover i{background:var(--cov);border:1px solid rgba(255,253,248,.35);transition:opacity .5s ease}
.cover i.off{opacity:0}
.tanzaku{writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-size:16px;line-height:1.9;background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:12px 8px;min-height:150px}
.trow{display:flex;gap:10px;justify-content:flex-end;margin:8px 0}
.insight{border-left:4px solid var(--ink);background:var(--mist);border-radius:0 14px 14px 0;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.7}
.insight.shu{border-color:var(--shu)}
.big{font-size:44px;font-weight:700;color:var(--ink-d);text-align:center;margin:12px 0 4px}
.seal{width:84px;height:84px;margin:24px auto 10px;border-radius:50%;border:4px solid var(--shu);color:var(--shu);display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP",serif;font-weight:700;font-size:20px;transform:rotate(-8deg)}
.talk{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--talk)}
.talkhead{background:var(--surface);padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.oa{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.talkbody{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.bubble{background:var(--surface);border-radius:6px 20px 20px 20px;padding:10px 14px;max-width:80%;font-size:14px;line-height:1.6}
.bubble .btn{display:block;width:100%;margin-top:10px;font-size:14px;padding:10px}
.time{font-size:10px;color:var(--sub);align-self:flex-end}
.zure{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.zure button{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:10px 4px;cursor:pointer}
.zure button.on{background:var(--shu);border-color:var(--shu);color:#fff}
details.more{margin:10px 0;border-radius:12px;background:var(--mist);padding:2px 12px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--sub);padding:8px 0}
.steam path{animation:steam 2.6s ease-in-out infinite;opacity:0}.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.6}.cover i{transition:none}}
.chip:disabled{cursor:not-allowed}
.steps button{flex:1;height:8px;border:0;border-radius:4px;background:var(--mist2);padding:0;cursor:pointer}
.steps button.on{background:var(--ink)}.steps button:disabled{cursor:default}
.steps button:not(:disabled):hover{outline:2px solid var(--ink-d);outline-offset:1px}
.pinned{flex:0 0 auto;padding:8px 16px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.pinned img{display:block;max-width:100%;max-height:26vh;width:auto;height:auto;border-radius:12px}
.lwrap{position:relative;width:fit-content;margin:0 auto;user-select:none;-webkit-user-select:none}
.lwrap.on{touch-action:none;cursor:zoom-in}
.lens{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #FFFDF8;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none;display:none;background-repeat:no-repeat;background-color:#fff}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 8px}
.pbar .chip{white-space:nowrap;flex:0 0 auto}
.rmenu{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface)}
.rmenu button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:13px;padding:10px 6px;cursor:pointer}
.rmenu small{display:block;font-weight:400;font-size:10.5px;color:var(--sub)}
.tgl{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px 6px 6px;font:inherit;font-size:14px;cursor:pointer}
.tgl .knob{width:44px;height:26px;border-radius:13px;background:var(--mist2);position:relative;flex:0 0 auto;transition:background .2s}
.tgl .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.tgl.on .knob{background:var(--ink)}.tgl.on .knob::after{left:21px}
.msel{border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.msel summary{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer;font-size:14px;list-style:none}
.msel summary::-webkit-details-marker{display:none}
.mlist{max-height:240px;overflow-y:auto;border-top:1px solid var(--line);padding:4px 0}
.mgrp{font-size:11.5px;color:var(--sub);padding:8px 12px 2px}
.mitem{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:14px;cursor:pointer}
.mitem input{width:18px;height:18px;accent-color:var(--ink)}
.rmv{border:0;background:rgba(255,255,255,.25);color:inherit;border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;font:inherit;font-size:13px;cursor:pointer}
select.ku{appearance:auto;-webkit-appearance:menulist}
.pause{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}

textarea.ku{resize:none;line-height:1.6}
.card ul li{list-style:disc}

const des=t=>JSON.parse(t,(k,x)=>x&&x.__set?new Set(x.__set):x);
function persist(){ try{ localStorage.setItem(KEY,ser({P:{...P,org:P.org&&P.org.code},S:{...S,_key:null,loupe:false}})); }catch(e){} }
function restore(){ try{ const d=des(localStorage.getItem(KEY)||"null"); if(!d) return;
  Object.assign(P,d.P||{}); P.org=d.P&&d.P.org?ORGS.find(o=>o.code===d.P.org)||null:null;
  if(d.S){ Object.assign(S,d.S); } }catch(e){} }
async function closeLine(finished){ persist();
  if(LIFF_OK&&liff.isInClient()){
    if(finished){ try{ await liff.sendMessages([{type:"text",text:"終わりました"}]); }catch(e){} }
    try{ liff.closeWindow(); return; }catch(e){} }
  S.ph="talk"; render(); }
function openLink(url,ext){ try{ if(LIFF_OK&&liff.isInClient()){ liff.openWindow({url,external:!!ext}); return; } }catch(e){} window.open(url,"_blank","noopener"); }
document.addEventListener("click",e=>{ const a=e.target.closest&&e.target.closest("[data-ext]"); if(!a) return; e.preventDefault(); openLink(LINKS[a.dataset.ext],a.dataset.ext==="video"); });
function param(k){ const q=new URLSearchParams(location.search); let v=q.get(k);
  if(!v){ const ls=q.get("liff.state"); if(ls){ const m=decodeURIComponent(ls).match(new RegExp("[?&]"+k+"=([^&#]+)")); if(m) v=decodeURIComponent(m[1]); } } return v; }
function orgFromText(t){ if(!t) return null; const m=String(t).match(/org=([A-Za-z0-9-]+)/)||String(t).match(/^(?:IPPUKU:)?([A-Z0-9-]+)$/); return m?m[1].toUpperCase():null; }
function selectOrg(code){ const o=ORGS.find(x=>x.code===code&&x.active); if(!o){ alert("この組織は見つかりませんでした（"+code+"）"); return; }
  P.org=o; P.orgs=[o.code]; if(P.nick&&P.exp){ const msgs=S.msgs; reset(); S.msgs=msgs; go("art1"); } else go("profile"); }
async function scanOrg(){ if(!(LIFF_OK&&liff.isApiAvailable&&liff.isApiAvailable("scanCodeV2"))){ alert("LINEの中で開いたときに使えます（スマホのカメラでQRを読んでも入れます）"); return; }
  try{ const r=await liff.scanCodeV2(); const c=orgFromText(r&&r.value); if(!c){ alert("いっぷ句の組織QRではないようです"); return; } selectOrg(c); }catch(e){ alert("読み取れませんでした"); } }
async function shareApp(){
  if(!(LIFF_OK&&liff.isApiAvailable&&liff.isApiAvailable("shareTargetPicker"))){ alert("LINEの中で開いたときに使えます"); return; }
  const from=S.lineName?S.lineName+"さんからのご紹介":"いっぷ句のご紹介";
  const msg={type:"flex",altText:"いっぷ句のご紹介：すき間時間で一枚の絵を見ることから始まる、15分の学び",contents:{type:"bubble",
    hero:{type:"image",url:LOGO_URL,size:"full",aspectRatio:"20:11",aspectMode:"fit",backgroundColor:"#EFEFEF"},
    body:{type:"box",layout:"vertical",spacing:"md",paddingAll:"20px",contents:[
      {type:"text",text:from,size:"xs",color:"#7A6A55"},
      {type:"text",text:"いっぷ句",size:"xxl",weight:"bold",color:"#2B3A42"},
      {type:"text",text:"「面白がり」で世界を変えていく。",size:"md",color:"#2F5D50",weight:"bold",wrap:true},
      {type:"text",text:"すき間時間で一枚の絵を見ることから始まる、15分の学び。",size:"sm",color:"#5A5A5A",wrap:true,margin:"md"}]},
    footer:{type:"box",layout:"vertical",spacing:"sm",contents:[{type:"button",style:"primary",color:"#2F5D50",action:{type:"uri",label:"友だち追加して始める",uri:ADD_FRIEND}},{type:"button",style:"link",height:"sm",color:"#2F5D50",action:{type:"uri",label:"紹介動画を見る",uri:LINKS.video}},{type:"text",text:"合同会社ぽっけいし｜特許出願中",size:"xxs",color:"#9A8B78",align:"center",decoration:"underline",action:{type:"uri",label:"会社サイト",uri:LINKS.company}}]}}};
  try{ await liff.shareTargetPicker([msg]); }catch(e){ alert("送れませんでした"); } }
function boot(){ let md=null; try{ md=localStorage.getItem("ippuku-mode"); }catch(e){} if(md==="full"){ location.replace("sora.html"+location.search+location.hash); return; }
  restore(); const view=param("view"), org=orgFromText(param("org"));
  if(org&&!(P.org&&P.org.code===org)){ selectOrg(org); return; }
  if(view==="history"&&P.org){ go("hist"); return; }
  if((view==="join"||view==="settings")){ if(!P.org){ go("org"); return; } S.tmp={nick:P.nick,exp:P.exp,org:P.org.code,consent:P.consent,mode:"lite"}; go("set"); return; }
  if(view==="posts"){ S.ph="talk"; render(); const b=document.getElementById("rm3"); if(b) b.click(); return; }
  if(S.paused||FLOW.includes(S.ph)){ if(FLOW.includes(S.ph)) S.paused=S.ph; S.ph="talk"; render(); return; }
  S.ph="talk"; render(); }
async function initLiff(){ try{ if(!window.liff) return; await liff.init({liffId:LIFF_ID}); LIFF_OK=true;
  if(liff.isLoggedIn()){ try{ const pr=await liff.getProfile(); S.lineName=pr.displayName; render(); }catch(e){} } }catch(e){} }
(async()=>{ try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const j=await r.json(); const q=new URLSearchParams(location.search);
  if(j.v&&j.v!==APP_VER&&q.get("v")!==j.v){ q.set("v",j.v); location.replace(location.pathname+"?"+q.toString()+location.hash); return; } } }catch(e){}
  boot(); initLiff(); })();
</script></body></html>
